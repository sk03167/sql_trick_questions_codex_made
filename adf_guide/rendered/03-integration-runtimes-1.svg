;}#design_2 .root .anchor path{fill:#475569!important;stroke-width:0;stroke:#475569;}#design_2 .arrowheadPath{fill:#0b0b0b;}#design_2 .edgePaths .path{stroke:#475569;stroke-width:1px;}#design_2 .flowchart-link{stroke:#475569;fill:none;}#design_2 .edgeLabel{background-color:#f8fafc;text-align:center;}#design_2 .edgeLabel p{background-color:#f8fafc;}#design_2 .edgeLabel rect{opacity:0.5;background-color:#f8fafc;fill:#f8fafc;}#design_2 .labelBkg{background-color:rgba(248, 250, 252, 0.5);}#design_2 .cluster rect{fill:#ffffff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#design_2 .cluster text{fill:#000000;}#design_2 .cluster span{color:#000000;}#design_2 .node .collapsed-indicator{fill:hsl(0, 0%, 90%);stroke:none;opacity:0.6;}#design_2 .node .collapsed-separator{stroke:hsl(0, 0%, 90%);stroke-width:0.75px;}#design_2 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#design_2 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#0f172a;}#design_2 rect.text{fill:none;stroke-width:0;}#design_2 .icon-shape,#design_2 .image-shape{background-color:#f8fafc;text-align:center;}#design_2 .icon-shape p,#design_2 .image-shape p{background-color:#f8fafc;padding:2px;}#design_2 .icon-shape .label rect,#design_2 .image-shape .label rect{opacity:0.5;background-color:#f8fafc;fill:#f8fafc;}#design_2 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#design_2 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#design_2 .node .neo-node{stroke:#475569;}#design_2 [data-look="neo"].node rect,#design_2 [data-look="neo"].cluster rect,#design_2 [data-look="neo"].node polygon{stroke:url(#design_2-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#design_2 [data-look="neo"].swimlane.cluster rect{filter:none;}#design_2 [data-look="neo"].node path{stroke:url(#