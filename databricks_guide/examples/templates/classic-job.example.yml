# Standalone bundle illustrating a classic-compute job; configure real values.
bundle:
  name: orders_classic_example
variables:
  workspace_host:
    description: Target host
  spark_version:
    description: Supported runtime ID from your workspace
  node_type_id:
    description: Cloud/region-specific allowed node ID
  policy_id:
    description: Approved job-compute policy ID
workspace:
  host: ${var.workspace_host}
resources:
  jobs:
    classic_example:
      name: orders_classic_example
      job_clusters:
        - job_cluster_key: orders_compute
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            autoscale:
              min_workers: 1
              max_workers: 2
      tasks:
        - task_key: ingest
          job_cluster_key: orders_compute
          notebook_task:
            notebook_path: ../notebooks/ingest_orders.py
            base_parameters:
              catalog: de_lab_dev
              run_date: '2026-10-12'
