# OPT-IN: protected masked OAuth variables and a CLI-equipped runner required.
stages: [test, deploy]
local-tests:
  stage: test
  script:
    - python3 -m unittest discover -s databricks_guide/examples/tests -v
deploy-dev:
  stage: deploy
  tags: [databricks-cli]
  environment: databricks-dev
  resource_group: databricks-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DATABRICKS_AUTH_TYPE: oauth-m2m
  script:
    - cd databricks_guide/examples
    - export BUNDLE_VAR_workspace_host="$DATABRICKS_HOST"
    - databricks current-user me
    - databricks bundle validate -t dev
    - databricks bundle deploy -t dev
    - databricks bundle run orders_daily -t dev --params 'catalog=de_lab_dev,run_date=2026-10-12,min_current_rows=2,validate_fixture=true'
